{% extends "base.html" %}{% block title %}Notifications{% endblock %}{% block crumb %}Notifications{% endblock %}
{% block content %}<div class="page-head"><div><h1>Class Notifications</h1><p>Arrival notifications and absence alerts for your assigned students.</p></div><button id="absenceBtn" class="btn btn-warning">Check today's absences</button></div><div class="card"><div id="body"><div class="loading-shimmer"></div></div></div>
<script>
const body=document.getElementById('body');
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function load(){try{const r=await fetch('/api/notifications',{headers:{'Accept':'application/json'}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load notifications.');body.innerHTML=d.length?d.map(n=>`<div class="notification ${n.read?'read':''}" data-id="${n.id}"><div><span class="badge ${n.kind==='arrival'?'badge-green':'badge-red'}">${esc(n.kind)}</span><strong>${esc(n.message)}</strong><div class="small muted">${esc(n.created_at)} · ${esc(n.status)}</div></div>${n.read?'':'<button class="btn btn-light" data-read="true">Mark read</button>'}</div>`).join(''):'<div class="empty">No notifications yet.</div>'}catch(e){body.innerHTML='<div class="message err">'+esc(e.message)+'</div>'}}
body.addEventListener('click',async e=>{const b=e.target.closest('[data-read]');if(!b)return;const row=b.closest('.notification');if(!row)return;setBusy(b,true,'Saving…');try{const r=await fetch('/api/notifications/'+row.dataset.id+'/read',{method:'POST'});if(!r.ok)throw new Error('Could not mark as read.');await load()}catch(err){showToast(err.message,'err')}finally{setBusy(b,false)}});
document.getElementById('absenceBtn').addEventListener('click',async e=>{const btn=e.currentTarget;setBusy(btn,true,'Checking…');try{const r=await fetch('{{ "/api/teacher/send-absence-alerts" if session.get("teacher_id") else "/api/admin/send-absence-alerts" }}',{method:'POST'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Absence check failed.');showToast(`Processed ${d.processed||0}. SMS ${d.sms_sent||0}, email ${d.email_sent||0}, Telegram ${d.telegram_sent||0}.`,'ok');await load()}catch(err){showToast(err.message,'err')}finally{setBusy(btn,false)}});
load();setInterval(load,30000);
</script>{% endblock %}{% block head %}<style>.notification{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.notification.read{opacity:.65}.notification strong{display:block;margin:8px 0 4px}@media(max-width:700px){.notification{align-items:flex-start;flex-direction:column}}</style>{% endblock %}
