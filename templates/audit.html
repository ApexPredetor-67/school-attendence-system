{% extends "base.html" %}{% block title %}Audit Log{% endblock %}{% block crumb %}Audit Log{% endblock %}{% block content %}<div class="page-head"><div><h1>Audit Log</h1><p>Administrative actions are recorded for traceability.</p></div></div><div class="card table-wrap"><table><thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Description</th></tr></thead><tbody id="body"></tbody></table></div><script>async function load(){const r=await fetch('/api/admin/audit');const d=await r.json();body.innerHTML=d.length?d.map(x=>`<tr><td>${x.timestamp}</td><td>${esc(x.admin)}</td><td><span class="badge badge-gray">${esc(x.action)}</span></td><td>${esc(x.description)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No audit entries.</td></tr>'}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();</script>{% endblock %}
