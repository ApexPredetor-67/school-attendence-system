services:
  - type: web
    name: student-attendance
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt && pip install --no-deps face-recognition==1.3.0
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    disk:
      name: attendance-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DATA_DIR
        value: /var/data
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_SENDER
        value: Student Attendance
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USE_TLS
        value: true
      - key: EMAIL_NOTIFICATIONS
        value: true
      - key: TELEGRAM_NOTIFICATIONS
        value: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SMS_NOTIFICATIONS
        value: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: DEFAULT_PHONE_COUNTRY_CODE
        value: +91
      - key: DEFAULT_PHONE_REGION
        value: IN
      - key: ATTENDANCE_THRESHOLD
        value: 75
      - key: WORKING_DAYS
        value: 6
      - key: FACE_RECOGNITION_TOLERANCE
        value: 0.48
      - key: MIN_FACE_SAMPLES
        value: 10
      - key: ABSENCE_ALERT_TIME
        value: "10:00"
      - key: ADMIN_EMAIL
        sync: false

  - type: cron
    name: student-attendance-absence-alerts
    runtime: python
    plan: starter
    region: singapore
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python jobs.py absence-alerts
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: /tmp
      - key: SECRET_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_SENDER
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USE_TLS
        value: true
      - key: TELEGRAM_NOTIFICATIONS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ABSENCE_ALERT_TIME
        value: "10:00"
      - key: SMS_NOTIFICATIONS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: DEFAULT_PHONE_COUNTRY_CODE
        value: +91
      - key: DEFAULT_PHONE_REGION
        value: IN
